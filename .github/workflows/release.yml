# Makes a release when a tag such as v0.8.0 is pushed: a self-contained x64 zip and a list of
# everything DeskAI depends on (a CycloneDX software bill of materials). No signing yet; see
# ADR 0030. The version people see on Privacy and AI comes from the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore (locked)
        run: dotnet restore DeskAI.sln --configfile NuGet.Config --locked-mode

      - name: Build and test
        run: |
          dotnet build DeskAI.sln -c Release --no-restore -p:Version=${{ env.VERSION }}
          dotnet test --solution DeskAI.sln -c Release --no-build --no-restore

      - name: Publish the app (self-contained, x64)
        run: >
          dotnet publish src/DeskAI.App/DeskAI.App.csproj -c Release -r win-x64 --self-contained
          -p:Version=${{ env.VERSION }} -p:WindowsAppSDKSelfContained=true
          -o publish/DeskAI

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/DeskAI/* -DestinationPath DeskAI-${{ env.VERSION }}-win-x64.zip

      # A software bill of materials, made only here so the app itself gains no dependency.
      - name: Software bill of materials
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX DeskAI.sln --output sbom --filename DeskAI-${{ env.VERSION }}-sbom.json --json

      - name: Known-vulnerable dependencies
        shell: pwsh
        run: |
          $report = dotnet list DeskAI.sln package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') { exit 1 }

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DeskAI-${{ env.VERSION }}-win-x64.zip
            sbom/DeskAI-${{ env.VERSION }}-sbom.json
          generate_release_notes: true
